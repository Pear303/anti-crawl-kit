[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prctl"
version = "0.1.0"
description = "PR gate CLI for the heavy-project auto PR playbook"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=3.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
prctl = "prctl.cli:main"

[tool.setuptools.packages.find]
include = ["prctl*"]

[tool.setuptools.package-data]
prctl = ["assets/*.yml", "assets/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF100"]
