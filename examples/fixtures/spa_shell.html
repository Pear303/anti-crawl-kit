<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Fixture · SPA 空壳</title>
  <!-- 真实 SPA 的首屏通常只有壳：可见文字很少，脚本很多，数据在接口里。 -->
  <style>
    :root { --bg: #ffffff; --text: #111111; --line: #e5e7eb; --muted: #6b7280; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI",
            "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #app { min-height: 100%; }
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      height: 56px; padding: 0 20px; border-bottom: 1px solid var(--line);
    }
    .app-header nav a { color: var(--muted); text-decoration: none; margin-left: 14px; }
    .placeholder {
      display: grid; place-items: center; min-height: 240px;
      color: var(--muted); font-size: 13px;
    }
    .skeleton {
      border-radius: 8px; background: linear-gradient(90deg, #f3f4f6, #e9ebef, #f3f4f6);
      background-size: 200% 100%; animation: shimmer 1.2s infinite linear;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }
  </style>
  <script src="/static/runtime.js"></script>
  <script src="/static/vendor.js"></script>
  <script src="/static/app.js"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
