[project]
name = "anti-crawl-kit"
dynamic = ["version"]
description = "浏览器自动化 + 反爬防风控基础工作包"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
# 浏览器层：patchright（Playwright 的防检测分支）
browser = ["patchright>=1.62.2"]
# HTTP 层：curl_cffi（TLS/JA3 指纹）
http = ["curl_cffi>=0.7.0"]
# 声明式平台配置（YAML）
config = ["PyYAML>=6.0"]
# MCP server（给 agent 直接调用）
mcp = ["mcp>=1.0"]
# 全部运行时能力
all = [
    "patchright>=1.62.2",
    "curl_cffi>=0.7.0",
    "PyYAML>=6.0",
    "mcp>=1.0",
]
# 开发与 CI
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "build>=1.2",
    "mypy>=1.11,<3",
]

[project.scripts]
# 统一入口：ack doctor / ack init recipe / ack recipe ...
ack = "anti_crawl_kit.tools.ack_cli:main"
ack-doctor = "anti_crawl_kit.tools.doctor:main"
ack-init = "anti_crawl_kit.tools.init_cli:main"
ack-probe = "anti_crawl_kit.tools.agent_probe:main"
ack-hunt = "anti_crawl_kit.tools.js_api_hunt:main"
ack-dom = "anti_crawl_kit.tools.dom_probe:main"
ack-detect = "anti_crawl_kit.tools.detector_check:main"
ack-bench = "anti_crawl_kit.tools.bench:main"
ack-audit = "anti_crawl_kit.tools.path_audit:main"
ack-health = "anti_crawl_kit.tools.health_cli:main"
ack-smoke = "anti_crawl_kit.tools.smoke_cli:main"
ack-mcp = "anti_crawl_kit.mcp_server:main"
ack-assess = "anti_crawl_kit.tools.assess_cli:main"
ack-report = "anti_crawl_kit.tools.report_cli:main"
ack-recipe = "anti_crawl_kit.tools.recipe_cli:main"
ack-ui = "anti_crawl_kit.ui:main"

[tool.setuptools.dynamic]
version = { attr = "anti_crawl_kit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# recipes/*.yaml 是 pip 安装后 ack-ui 默认能列出的内置配方
anti_crawl_kit = ["py.typed", "recipes/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "browser: 需要真实浏览器/网络，默认不跑；设置 ACK_BROWSER=1 开启",
    "network: 需要外网访问",
]

[tool.coverage.run]
source = ["anti_crawl_kit"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# prctl 是 vendored 的门禁工具，有独立 pyproject 和测试，不参与本包 lint
exclude = [".venv", "build", "dist", "prctl"]

[tool.ruff.lint]
# 常规集合：错误 + pyflakes + 警告 + import 排序 + 语法升级 + bugbear。
# RUF100 单独开：无用的 noqa 会掩盖真实问题，必须能被发现。
select = ["E", "F", "W", "I", "UP", "B", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# ui_assets.py 只放内嵌 HTML/CSS/JS 字符串，行宽由前端语法决定，
# 按 Python 代码折行反而会把样式表切碎。
"src/anti_crawl_kit/ui_assets.py" = ["E501"]

[tool.mypy]
# 类型检查用 3.11 口径：StrEnum 等 3.11 才进 typeshed 的 API 需要它。
# 运行时兼容 3.10 由 CI 的 3.10 测试矩阵保证，不靠 mypy 兜底。
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests/", "examples/"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
