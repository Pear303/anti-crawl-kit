name: prctl-gate

# 总门禁：证据 / 审核 / 安全 / 风险 / 发布五项齐全才放行。
# 规则来源是 .prctl/policy.yml，不是 workflow 里的硬编码。

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        if: github.event_name == 'pull_request'
        with:
          python-version: "3.12"
      - name: Install prctl
        if: github.event_name == 'pull_request'
        run: python -m pip install --quiet -e ./prctl
      - name: Classify changed files
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin "$BASE_REF"
          git diff --name-only "origin/$BASE_REF...HEAD" > changed.txt
          prctl risk --pr "$PR_NUMBER" --files-from changed.txt
      - name: Count approvals
        id: approvals
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh pr view "${{ github.event.pull_request.number }}" --json reviews \
            --jq '[.reviews | group_by(.author.login)[] | last | select(.state=="APPROVED")] | length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
      - name: Run prctl gate
        if: github.event_name == 'pull_request'
        run: |
          prctl gate --pr "${{ github.event.pull_request.number }}" \
            --approvals "${{ steps.approvals.outputs.count }}"
      - name: Merge group already gated
        if: github.event_name == 'merge_group'
        run: |
          echo "PR 级 prctl gate 已通过；合并队列只重跑 CI。"
