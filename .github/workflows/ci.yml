name: ci

on:
  push:
  pull_request:

jobs:
  # 纯逻辑：不装 patchright / curl_cffi，证明包可以在无浏览器环境使用
  offline:
    name: offline (no browser deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core + dev only)
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest (offline)
        run: pytest -q -m "not browser"
      - name: Import without optional deps
        run: python -c "import anti_crawl_kit; print(anti_crawl_kit.__version__)"
      - name: Build sdist/wheel
        run: python -m build

  # 全依赖：验证 extras 能装上、测试仍全绿
  with-deps:
    name: with deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (all extras)
        run: pip install -e ".[all,dev]"
      - name: Pytest (offline)
        run: pytest -q -m "not browser"

  # 浏览器集成：手动触发（需要 Chrome，CI 里成本高）
  browser:
    name: browser integration (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[all,dev]"
      - run: python -m patchright install chrome
      - run: pytest -q -m browser
        env:
          ACK_BROWSER: "1"
