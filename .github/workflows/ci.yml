name: ci

on:
  push:
  pull_request:
  # 手动触发：用于跑 browser job，或在不推代码时复跑全量
  workflow_dispatch:

jobs:
  # 静态检查只跑一次，不跟着 Python 版本矩阵重复
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install (core + dev only)
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests

  # 纯逻辑：不装 patchright / curl_cffi，证明包可以在无浏览器环境使用
  offline:
    name: offline (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install (core + dev only)
        run: pip install -e ".[dev]"
      - name: Pytest (offline)
        run: pytest -q -m "not browser"
      - name: Import without optional deps
        run: python -c "import anti_crawl_kit; print(anti_crawl_kit.__version__)"
      # 构建只需要在一个版本上验证，避免重复产物
      - name: Build sdist/wheel
        if: matrix.python-version == '3.12'
        run: python -m build

  # 全依赖：验证 extras 能装上、测试仍全绿
  with-deps:
    name: with deps (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install (all extras)
        run: pip install -e ".[all,dev]"
      - name: Pytest (offline)
        run: pytest -q -m "not browser"

  # 浏览器集成：手动触发（需要 Chrome，CI 里成本高）
  browser:
    name: browser integration (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - run: pip install -e ".[all,dev]"
      - run: python -m patchright install chrome
      - run: pytest -q -m browser
        env:
          ACK_BROWSER: "1"
