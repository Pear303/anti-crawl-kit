name: release

on:
  push:
    tags:
      - "v*"
  # 手动补发：输入已存在的 tag，重跑构建 + PyPI + GitHub Release
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.10.0）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # tag 和包版本必须一致，避免 v0.11.0 的 tag 打出 0.10.0 的包
      - name: Check tag matches __version__
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import sys

          tag = os.environ["TAG"].strip()
          if not tag.startswith("v"):
              sys.exit(f"tag 必须以 v 开头：{tag}")
          text = pathlib.Path("src/anti_crawl_kit/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          if not match:
              sys.exit("找不到 __version__")
          version = match.group(1)
          if version != tag[1:]:
              sys.exit(f"tag {tag} 与 __version__ {version} 不一致")
          print(f"version={version}")
          PY
      - name: Install build
        run: pip install build
      - name: Build sdist/wheel
        run: python -m build
      # 在干净 venv 里装 wheel，确认入口点和版本都对
      - name: Smoke test wheel
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          /tmp/venv/bin/python -c "import anti_crawl_kit; print(anti_crawl_kit.__version__)"
          /tmp/venv/bin/ack-report --help >/dev/null
          /tmp/venv/bin/ack-ui --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/anti-crawl-kit
    permissions:
      # OIDC trusted publishing，不需要在仓库里存 PyPI token
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # 已存在 Release 时只补传产物，不重复创建
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi
